# Redraws the contribution "city" every night with Skyline
# (https://github.com/pinkpixel-dev/skyline) and publishes it to the `output` branch,
# so main doesn't collect a daily "update" commit. Pinned to a release on purpose.
name: skyline

on:
  schedule:
    - cron: "17 3 * * *"   # 09:17 in Dhaka
  workflow_dispatch:

permissions:
  contents: write

jobs:
  skyline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Draw skyline
        env:
          # SKYLINE_TOKEN (classic token, read:user) also counts private contributions.
          GITHUB_TOKEN: ${{ secrets.SKYLINE_TOKEN || secrets.GITHUB_TOKEN }}
        run: go run github.com/pinkpixel-dev/skyline@v1.0.0 -theme neon -svg skyline.svg "${{ github.repository_owner }}"

      - name: Publish to the output branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir out && mv skyline.svg out/ && cd out
          git init -q -b output
          git add skyline.svg
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "Update skyline"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" output
